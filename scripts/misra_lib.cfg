<?xml version="1.0"?>
<!--
  cppcheck 自定义库：MISRA 门禁 Windows 二遍（make misra 的 -D_WIN32 pass）专用，
  补齐 windows.cfg 未覆盖的 Win32 API 与 WS2TCP/IP 函数原型，
  消除 MISRA 17.3（隐式声明）误报。POSIX 一遍用真实系统头文件，无需本库。
-->
<def format="2">
  <function name="inet_pton"><noreturn>false</noreturn></function>
  <function name="inet_ntop"><noreturn>false</noreturn></function>
  <function name="freeaddrinfo"><noreturn>false</noreturn></function>
  <function name="poll"><noreturn>false</noreturn></function>
  <function name="MoveFileExA"><noreturn>false</noreturn></function>
  <function name="GetTickCount64"><noreturn>false</noreturn></function>
  <function name="Sleep"><noreturn>false</noreturn></function>
  <function name="SetConsoleOutputCP"><noreturn>false</noreturn></function>
  <function name="SetConsoleCP"><noreturn>false</noreturn></function>
  <function name="GetModuleFileNameW"><noreturn>false</noreturn></function>
  <function name="GetStdHandle"><noreturn>false</noreturn></function>
  <function name="GetConsoleMode"><noreturn>false</noreturn></function>
  <function name="SetConsoleMode"><noreturn>false</noreturn></function>
  <function name="CreateFileA"><noreturn>false</noreturn></function>
  <function name="CloseHandle"><noreturn>false</noreturn></function>
</def>
